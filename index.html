<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Rewards</title>

  <!-- Monetag Telegram Mini App SDK Script -->
  <script src='//libtl.com/sdk.js' data-zone='11786633' data-sdk='show_11786633'></script>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a; /* Deep dark background */
      color: #f8fafc;
    }

    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #334155;
      color: #ffffff;
      padding: 25px 20px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #38bdf8;
    }

    .header p {
      margin: 0;
      color: #94a3b8;
    }

    .card {
      background: #1e293b; /* Dark slate card background */
      border: 1px solid #334155;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .card h2 {
      color: #f8fafc;
      font-size: 20px;
      margin-top: 0;
    }

    .coin {
      font-size: 45px;
    }

    .balance {
      font-size: 32px;
      font-weight: bold;
      margin: 10px 0;
      color: #38bdf8;
    }

    p {
      color: #94a3b8;
    }

    button {
      width: 100%;
      border: none;
      padding: 16px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .ad-box {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      border: 1px dashed #475569;
      border-radius: 15px;
      color: #64748b;
      margin-top: 15px;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
      color: #38bdf8;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>🎁 Daily Rewards</h1>
    <p>Welcome to your daily rewards!</p>
  </div>

  <div class="card">
    <div class="coin">🪙</div>
    <div class="balance" id="balance">0 Coins</div>
    <p>Come back every day for your reward.</p>

    <button onclick="claimReward()">
      🎁 Claim Daily Reward
    </button>

    <div class="message" id="message"></div>
  </div>

  <div class="card">
    <h2>📢 Sponsored</h2>

    <div class="ad-box">
      Monetag Ad Area
    </div>

  </div>

  <div class="card">
    <h2>⭐ How it works</h2>
    <p style="margin: 5px 0;">1. Open the app</p>
    <p style="margin: 5px 0;">2. Claim your daily reward</p>
    <p style="margin: 5px 0;">3. Come back tomorrow</p>
  </div>

  <div class="footer">
    Daily Rewards App
  </div>

</div>

<script>

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  let balance = Number(localStorage.getItem("balance")) || 0;

  document.getElementById("balance").innerText =
    balance + " Coins";


  function claimReward() {

    const today = new Date().toDateString();
    const lastClaim = localStorage.getItem("lastClaim");

    if (lastClaim === today) {

      document.getElementById("message").innerText =
        "⏰ You already claimed today's reward!";

      return;
    }

    // Monetag Rewarded Popup function eka
    if (typeof show_11786633 === 'function') {
        show_11786633('pop').then(() => {
            giveReward();
        }).catch(e => {
            giveReward();
        });
    } else {
        giveReward();
    }
  }

  function giveReward() {
    const today = new Date().toDateString();
    balance += 100;

    localStorage.setItem("balance", balance);
    localStorage.setItem("lastClaim", today);

    document.getElementById("balance").innerText =
      balance + " Coins";

    document.getElementById("message").innerText =
      "🎉 Congratulations! You received 100 coins.";
  }

</script>

</body>
</html>
