<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Reward App</title>

  <!-- Monetag Telegram Mini App SDK Script -->
  <script src='//libtl.com/sdk.js' data-zone='11786633' data-sdk='show_11786633'></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0b0f19;
      color: #f8fafc;
    }

    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 40px;
    }

    .header {
      background: linear-gradient(135deg, #1e1b4b, #311042);
      border: 1px solid #4c1d95;
      padding: 24px 20px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .header h1 {
      font-size: 24px;
      color: #c084fc;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 13px;
      color: #94a3b8;
    }

    .balance-box {
      font-size: 34px;
      font-weight: bold;
      color: #38bdf8;
      margin: 15px 0;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .actions-grid {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      flex: 1;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
    }

    .btn-success {
      background: linear-gradient(135deg, #059669, #047857);
      color: white;
      box-shadow: 0 4px 15px rgba(5, 150, 105, 0.4);
    }

    .btn-ref {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: white;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
      width: 100%;
      margin-bottom: 16px;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .card h3 {
      font-size: 18px;
      color: #f3f4f6;
      margin-bottom: 12px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1f2937;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid #374151;
    }

    .task-info h4 {
      font-size: 14px;
      color: #e5e7eb;
    }

    .task-info p {
      font-size: 12px;
      color: #9ca3af;
    }

    .task-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      margin-top: 10px;
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      color: #38bdf8;
    }

    .footer {
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- Header Section without User Profile -->
  <div class="header">
    <h1>💎 Crypto Rewards</h1>
    <p>Mine & Earn Daily Assets</p>
    <div class="balance-box" id="balance">0.00 COINS</div>
  </div>

  <!-- Main Action Buttons -->
  <div class="actions-grid">
    <button class="btn btn-primary" onclick="claimReward()">
      🎁 Watch & Claim
    </button>
    <button class="btn btn-success" onclick="openWithdraw()">
      🏦 Withdraw
    </button>
  </div>

  <!-- Invite Friends / Referral Button -->
  <button class="btn btn-ref" onclick="inviteFriends()">
    👥 Invite Friends (+500 Coins)
  </button>

  <div class="message" id="message"></div>

  <!-- Tasks Section -->
  <div class="card">
    <h3>⚡ Earn Extra Coins (Tasks)</h3>

    <div class="task-item">
      <div class="task-info">
        <h4>Watch Bonus Ad</h4>
        <p>Earn +50 Coins instantly</p>
      </div>
      <button class="task-btn" onclick="watchBonusAd()">Start</button>
    </div>

    <div class="task-item">
      <div class="task-info">
        <h4>Join Telegram Channel</h4>
        <p>Earn +200 Coins</p>
      </div>
      <button class="task-btn" onclick="alert('Channel joined successfully!')">Join</button>
    </div>
  </div>

  <!-- App Info Card -->
  <div class="card">
    <h3>📊 Account Status</h3>
    <p style="color: #9ca3af; font-size: 13px; margin-bottom: 6px;">Status: <span style="color: #10b981; font-weight: bold;">Active</span></p>
    <p style="color: #9ca3af; font-size: 13px;">Minimum Withdraw: <span style="color: #f59e0b; font-weight: bold;">5,000 Coins</span></p>
  </div>

  <div class="footer">
    Secure Crypto WebApp v2.0
  </div>

</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  // Get user ID for referral system silently
  let userId = "12345";
  const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (user && user.id) {
    userId = user.id;
  }

  let balance = Number(localStorage.getItem("balance")) || 0;
  updateBalanceDisplay();

  function updateBalanceDisplay() {
    document.getElementById("balance").innerText = balance.toLocaleString() + " COINS";
  }

  function claimReward() {
    const today = new Date().toDateString();
    const lastClaim = localStorage.getItem("lastClaim");

    if (lastClaim === today) {
      document.getElementById("message").innerText = "⏰ Already claimed today! Try tasks.";
      return;
    }

    triggerAd(() => {
      balance += 100;
      localStorage.setItem("balance", balance);
      localStorage.setItem("lastClaim", today);
      updateBalanceDisplay();
      document.getElementById("message").innerText = "🎉 Success! +100 Coins added.";
    });
  }

  function watchBonusAd() {
    triggerAd(() => {
      balance += 50;
      localStorage.setItem("balance", balance);
      updateBalanceDisplay();
      document.getElementById("message").innerText = "🎉 Bonus earned! +50 Coins added.";
    });
  }

  function inviteFriends() {
    const botUsername = "dailyrewardsapp_bot";
    const refLink = `https://t.me/${botUsername}?start=ref_${userId}`;
    const shareText = `🚀 Join Daily Crypto Rewards and start earning free coins! Use my link to join: ${refLink}`;
    
    const telegramShareUrl = `https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent(shareText)}`;
    window.open(telegramShareUrl, '_blank');
  }

  function triggerAd(onSuccess) {
    if (typeof show_11786633 === 'function') {
      show_11786633('pop').then(() => {
        onSuccess();
      }).catch(e => {
        onSuccess();
      });
    } else {
      onSuccess();
    }
  }

  function openWithdraw() {
    if (balance < 5000) {
      alert("❌ Insufficient balance! Minimum withdrawal is 5,000 Coins.");
    } else {
      alert("✅ Withdrawal request submitted successfully! Funds will arrive soon.");
    }
  }
</script>

</body>
</html>
